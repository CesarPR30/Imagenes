<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figura de capas</title>
<style>
:root{--bg:#f3f4f6;--panel:#ffffff;--ink:#1f2328;--muted:#667085;--line:#e3e6ea;--acc:#b4161d;--stage:#d9dce1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--panel:#1d2024;--ink:#e8eaed;--muted:#9aa1ab;--line:#2d3137;--acc:#f0565c;--stage:#0e0f11}}
:root[data-theme="dark"]{--bg:#15171a;--panel:#1d2024;--ink:#e8eaed;--muted:#9aa1ab;--line:#2d3137;--acc:#f0565c;--stage:#0e0f11}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;height:100vh}
#side{width:370px;min-width:370px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px 14px 40px}
#side h1{font-size:16px;margin:2px 0 2px}
#side .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
details{border-top:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;font-weight:600;padding:4px 0;list-style:none}
summary::before{content:"▸ ";color:var(--muted)}
details[open]>summary::before{content:"▾ "}
.row{display:grid;grid-template-columns:150px 1fr 44px;gap:6px;align-items:center;margin:4px 0}
.row label{color:var(--muted);font-size:12px}
.row input[type=range]{width:100%}
.row input[type=number],.row input[type=text],.row select{width:100%;padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);font:inherit}
.row .val{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);text-align:right}
.row.wide{grid-template-columns:150px 1fr}
.head{margin:12px 0 4px;font-weight:600;font-size:12px;color:var(--acc);display:flex;gap:6px;align-items:center}
.head input[type=text]{flex:1;padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);font:inherit;font-weight:400}
button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;width:100%;margin:3px 0}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
#mini{width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:#fafafa;cursor:crosshair;touch-action:none}
.hint{font-size:11px;color:var(--muted);margin:2px 0 6px}
#status{font-size:12px;margin:6px 0;color:var(--muted);min-height:16px}
#stage{flex:1;overflow:auto;background:var(--stage);display:flex;align-items:flex-start;justify-content:center;padding:18px}
#fig{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);max-width:100%;height:auto}
#dims{position:fixed;right:14px;bottom:10px;font-size:11px;color:var(--muted);background:var(--panel);padding:3px 8px;border-radius:5px;border:1px solid var(--line)}
@media (max-width:800px){#app{flex-direction:column;height:auto}#side{width:100%;min-width:0;border-right:0}#stage{padding:16px}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>Figura de capas — de eventos a subgrafo</h1>
    <div class="sub">Siete representaciones espaciales del mismo conjunto de delitos, apiladas como láminas.</div>
    <canvas id="mini" width="600" height="600"></canvas>
    <div class="hint">Clic o arrastre: mueve la ventana · Shift + clic: mueve el área de zoom · Rueda: acerca/aleja</div>
    <div id="status"></div>
    <div id="controls"></div>
  </aside>
  <main id="stage"><canvas id="fig"></canvas></main>
</div>
<div id="dims"></div>
<script src="svgctx.js"></script>
<script>
"use strict";
// ───────────────────────── estado ─────────────────────────
const LAYERS = [
  {id:'raw',    en:'Crime events (raw)',      es:'Eventos delictivos (crudos)'},
  {id:'kde',    en:'Kernel density (KDE)',    es:'Densidad kernel (KDE)'},
  {id:'census', en:'Census blocks',           es:'Manzanas censales'},
  {id:'grid',   en:'Regular grid',            es:'Grilla regular'},
  {id:'inter',  en:'Street intersections',    es:'Intersecciones viales'},
  {id:'seg',    en:'Street segments',         es:'Segmentos viales'},
  {id:'topo',   en:'Topo-crime subgraph',     es:'Subgrafo topo-crimen'},
];
const PRESETS = {
  rojos:   ['#fde0c5','#f26b3a','#9e0b0f'],
  magma:   ['#fcf1b4','#f1605d','#3b0f70'],
  inferno: ['#fbe38c','#e8583a','#5c126e'],
  viridis: ['#fde725','#21918c','#440154'],
  azules:  ['#d6e6f4','#4a98c9','#08306b'],
  grises:  ['#e3e3e3','#8c8c8c','#1a1a1a'],
};
const DEFAULTS = {
  source:'lima', hotspot:0, realHot:true,
  osmLat:-12.0464, osmLon:-77.0428, osmRadius:700,
  nCrimes:300, lambda:75, seed:7,
  viewX:0, viewY:0, viewSize:760,
  W:430, rot:20, tilt:0.46, sep:170, thick:5, opacity:0.97, order:'physical', shadow:0.6, guides:true, frameColor:'#5b6573',
  inset:true, insetSize:150, insetGap:70, zoomSize:230, zoomDX:0, zoomDY:0, zoomFrame:true, insetSym:1.7,
  preset:'rojos', c0:'#fde0c5', c1:'#f26b3a', c2:'#9e0b0f', gamma:0.75, sat:0.5,
  crimeColor:'#c0141c', crimeR:2.2, crimeAlpha:0.85, spread:7,
  land:'#e4e4e1', building:'#d1d1ce', street:'#ffffff', avenue:'#f7dcae', park:'#c4dcae', water:'#bcd6ec', streetScale:1, baseFade:0.12,
  kdeBw:55, kdeAlpha:0.88, kdeCut:0.05, kdeDots:true,
  censusN:4, censusMode:'choro', censusAlpha:0.62, censusDots:true,
  gridN:14, gridAlpha:0.85, gridDots:false, gridLine:'#5f6873', gridLineW:1, gridLineAlpha:0.75, gridEmpty:0.06,
  interMin:1.6, interMax:10, interEmpty:true,
  snapR:0, cScale:'sqrt', cRef:0, cMinCount:1, cMinI:3, cMaxI:16, cIndep:false, cLabels:false, cLabelMin:3,
  segMin:1.2, segMax:6.5, segNorm:'count', segGap:3.5, segAll:true, segBase:'#b9bec6', segNodes:true,
  subQ:0.35, haloW:20, haloAlpha:0.45, topoContext:true,
  labels:'left', labelW:150, lang:'en', prefix:true, font:'Georgia', fontSize:14, labelColor:'#222222', legend:true,
  bg:'#ffffff', transparent:false, exportScale:'4', exportFormat:'png',
};
LAYERS.forEach(L => { DEFAULTS['on_'+L.id] = true; DEFAULTS['lbl_'+L.id] = ''; });

// Carpeta de datos: ?data=data/sintetico la cambia sin tocar el código.
const DATA_DIR = new URLSearchParams(location.search).get('data') || 'data/sintetico';
const KEY = 'figura-capas.v1';
let S = Object.assign({}, DEFAULTS);
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ───────────────────────── utilidades ─────────────────────────
// Superficie de dibujo: <canvas> en pantalla y PNG; SvgCtx (svgctx.js) al exportar SVG.
let SVG_MODE = false;
const surface = (w, h) => SVG_MODE ? new SvgCtx(w, h) : Object.assign(document.createElement('canvas'), {width:w, height:h});
function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

const $ = s => document.querySelector(s);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r){ let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
const hex = h => { h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
const mixc = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const css = (c, a = 1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function ramp(t){ t = clamp(t, 0, 1); const a = hex(S.c0), b = hex(S.c1), c = hex(S.c2); return t < .5 ? mixc(a, b, t * 2) : mixc(b, c, (t - .5) * 2); }
const tn = (v, max) => max > 0 ? Math.pow(clamp(v / max, 0, 1), S.gamma) : 0;
function segD2(px, py, ax, ay, bx, by){ const dx = bx-ax, dy = by-ay, L = dx*dx+dy*dy; let t = L ? ((px-ax)*dx+(py-ay)*dy)/L : 0; t = clamp(t,0,1); const x = ax+t*dx-px, y = ay+t*dy-py; return x*x+y*y; }
const plen = pts => { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); return s; };
function pointAt(pts, d){ for (let i = 1; i < pts.length; i++){ const l = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); if (d <= l || i === pts.length-1){ const t = l ? clamp(d/l,0,1) : 0; return [pts[i-1][0]+t*(pts[i][0]-pts[i-1][0]), pts[i-1][1]+t*(pts[i][1]-pts[i-1][1]), (pts[i][0]-pts[i-1][0])/(l||1), (pts[i][1]-pts[i-1][1])/(l||1)]; } d -= l; } return [...pts[0],1,0]; }
const status = (t, err) => { const el = $('#status'); el.textContent = t || ''; el.style.color = err ? 'var(--acc)' : ''; };

// ───────────────────────── datos ─────────────────────────
// Modelo común (metros, x al este, y al sur):
// D = {nodes:[[x,y]], edges:[{u,v,cls,pts}], crimes:[[x,y]], buildings, parks, water, f, hotspots:[{name,nodes}]}
let D = null, LIMA = null;

function edgesFinish(d){
  d.edges.forEach(e => { e.len = plen(e.pts); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; e.pts.forEach(p => { x0=Math.min(x0,p[0]); y0=Math.min(y0,p[1]); x1=Math.max(x1,p[0]); y1=Math.max(y1,p[1]); }); e.bb=[x0,y0,x1,y1]; });
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; d.nodes.forEach(p => { x0=Math.min(x0,p[0]); y0=Math.min(y0,p[1]); x1=Math.max(x1,p[0]); y1=Math.max(y1,p[1]); });
  d.extent = [x0,y0,x1,y1];
  d.buildings = d.buildings || []; d.parks = d.parks || []; d.water = d.water || [];
  return d;
}

async function loadLima(){
  if (!LIMA){
    const r = await fetch(DATA_DIR + '/explainer.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    LIMA = await r.json();
  }
  const c = LIMA.clip, N = c.nodes;
  const d = {
    nodes: N.map(p => [p[0], p[1]]),
    edges: c.edges.map(e => ({u:e[0], v:e[1], cls:e[2], pts:[N[e[0]], ...(e[3]||[]), N[e[1]]]})),
    crimes: c.crimes.map(p => [p[0], p[1]]),
    f: c.f.slice(),
    hotspots: c.hotspots.map(h => ({name:h.id, nodes:h.nodes})),
    buildings: c.buildings, parks: c.parks, water: c.water,
    origin: LIMA.meta.center,  // [lon, lat]; null en los datos sintéticos
    label: `${LIMA.meta.synthetic ? 'Ciudad sintética (datos de ejemplo)' : 'Lima · ' + LIMA.meta.month} · ${c.crimes.length} delitos`,
  };
  return edgesFinish(d);
}

function synthNetwork(seed){
  const r = rng(seed), sp = 78, n = 9, nodes = [], idx = {}, edges = [], buildings = [], parks = [];
  for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++){
    idx[i+','+j] = nodes.length;
    nodes.push([i*sp + gauss(r)*7 + j*6, j*sp + gauss(r)*7 - i*4]);
  }
  const cls = (i, a) => i === 0 ? 'avenue' : (Math.abs(i) % 4 === 2 ? 'collector' : 'street');
  for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++){
    const a = idx[i+','+j];
    if (i < n && (j === 0 || r() > .07)) edges.push({u:a, v:idx[(i+1)+','+j], cls:cls(j)});
    if (j < n && (i === 0 || r() > .07)) edges.push({u:a, v:idx[i+','+(j+1)], cls:cls(i)});
  }
  edges.forEach(e => e.pts = [nodes[e.u], nodes[e.v]]);
  // manzanas con edificios
  for (let i = -n; i < n; i++) for (let j = -n; j < n; j++){
    const q = [nodes[idx[i+','+j]], nodes[idx[(i+1)+','+j]], nodes[idx[(i+1)+','+(j+1)]], nodes[idx[i+','+(j+1)]]];
    const ins = 0.16, cx = (q[0][0]+q[2][0])/2, cy = (q[0][1]+q[2][1])/2;
    const sh = q.map(p => [p[0]+(cx-p[0])*ins, p[1]+(cy-p[1])*ins]);
    if (r() < .06){ parks.push(sh); continue; }
    const k = 2 + (r() < .5 ? 1 : 0);
    for (let a = 0; a < k; a++) for (let b = 0; b < k; b++){
      const L = (u, v) => { const x0 = sh[0][0]+(sh[1][0]-sh[0][0])*u, y0 = sh[0][1]+(sh[1][1]-sh[0][1])*u, x1 = sh[3][0]+(sh[2][0]-sh[3][0])*u, y1 = sh[3][1]+(sh[2][1]-sh[3][1])*u; return [x0+(x1-x0)*v, y0+(y1-y0)*v]; };
      const g = .05;
      buildings.push([L(a/k+g, b/k+g), L((a+1)/k-g, b/k+g), L((a+1)/k-g, (b+1)/k-g), L(a/k+g, (b+1)/k-g)]);
    }
  }
  return {nodes, edges, buildings, parks, water:[], label:'Red sintética'};
}

const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
async function overpass(q){
  let last;
  for (const url of OVERPASS){
    try { const r = await fetch(url, {method:'POST', body:'data=' + encodeURIComponent(q)}); if (r.ok) return await r.json(); last = new Error('HTTP ' + r.status); }
    catch (e) { last = e; }
  }
  throw last;
}
function proj(lon0, lat0){ const kx = Math.cos(lat0*Math.PI/180)*111320, ky = 110540; return (lon, lat) => [(lon-lon0)*kx, (lat0-lat)*ky]; }
function bboxStr(lon0, lat0, R){ const dl = R/110540, dn = R/(Math.cos(lat0*Math.PI/180)*111320); return `${lat0-dl},${lon0-dn},${lat0+dl},${lon0+dn}`; }

async function fetchOsm(lon0, lat0, R, roads){
  const bb = bboxStr(lon0, lat0, R), P = proj(lon0, lat0);
  const q = `[out:json][timeout:90];(${roads ? `way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|motorway_link|trunk_link|primary_link|secondary_link)$"](${bb});` : ''}way["building"](${bb});way["leisure"~"^(park|garden|pitch|playground)$"](${bb});way["landuse"~"^(grass|recreation_ground|village_green)$"](${bb});way["natural"="water"](${bb}););out geom;`;
  const js = await overpass(q);
  const out = {buildings:[], parks:[], water:[], ways:[]};
  for (const w of js.elements){
    if (w.type !== 'way' || !w.geometry) continue;
    const pts = w.geometry.map(g => P(g.lon, g.lat)), t = w.tags || {};
    if (t.highway) out.ways.push({ids:w.nodes, pts, hw:t.highway});
    else if (t.building) out.buildings.push(pts);
    else if (t.natural === 'water') out.water.push(pts);
    else out.parks.push(pts);
  }
  return out;
}
function osmNetwork(ways){
  const use = new Map();
  ways.forEach(w => w.ids.forEach((id, k) => use.set(id, (use.get(id)||0) + (k === 0 || k === w.ids.length-1 ? 2 : 1))));
  const nodes = [], nid = new Map(), edges = [];
  const getN = (id, p) => { if (!nid.has(id)){ nid.set(id, nodes.length); nodes.push(p); } return nid.get(id); };
  const cls = h => /^(motorway|trunk|primary|secondary)/.test(h) ? 'avenue' : h === 'tertiary' ? 'collector' : h === 'service' ? 'service' : 'street';
  for (const w of ways){
    let s = 0;
    for (let k = 1; k < w.ids.length; k++){
      if (k === w.ids.length-1 || use.get(w.ids[k]) > 1){
        const a = getN(w.ids[s], w.pts[s]), b = getN(w.ids[k], w.pts[k]);
        if (a !== b) edges.push({u:a, v:b, cls:cls(w.hw), pts:w.pts.slice(s, k+1)});
        s = k;
      }
    }
  }
  return {nodes, edges};
}

// Delitos simulados sobre la red: decaimiento exponencial con la distancia de red al hotspot.
function synthCrimes(d){
  const r = rng(S.seed * 31 + 5), N = d.nodes.length, adj = adjacency(d);
  const deg = adj.map(a => a.length);
  const pick = (x, y) => { let best = -1, bd = 1e18; d.nodes.forEach((p, i) => { if (deg[i] < 3) return; const q = (p[0]-x)**2 + (p[1]-y)**2; if (q < bd){ bd = q; best = i; } }); return best < 0 ? 0 : best; };
  const dij = src => { const dist = new Float64Array(N).fill(Infinity); dist[src] = 0; const done = new Uint8Array(N);
    for (;;){ let u = -1, bu = Infinity; for (let i = 0; i < N; i++) if (!done[i] && dist[i] < bu){ bu = dist[i]; u = i; } if (u < 0) break; done[u] = 1;
      for (const [v, ei] of adj[u]){ const nd = bu + d.edges[ei].len; if (nd < dist[v]) dist[v] = nd; } } return dist; };
  const hs = [[pick(0,0), 1, S.lambda], [pick(240, -170), .18, S.lambda*.6], [pick(-280, 210), .12, S.lambda*.5]];
  const dists = hs.map(h => dij(h[0]));
  const w = d.edges.map(e => { let s = .012; hs.forEach((h, k) => { const dm = Math.min(dists[k][e.u], dists[k][e.v]); s += h[1]*Math.exp(-dm/h[2]); }); return e.len*s; });
  const cum = []; w.reduce((a, b, i) => (cum[i] = a + b), 0);
  const tot = cum[cum.length-1], crimes = [];
  for (let k = 0; k < S.nCrimes; k++){
    const x = r()*tot; let lo = 0, hi = cum.length-1; while (lo < hi){ const m = (lo+hi) >> 1; if (cum[m] < x) lo = m+1; else hi = m; }
    const e = d.edges[lo], p = pointAt(e.pts, r()*e.len), j = gauss(r)*3;
    crimes.push([p[0] - p[3]*j, p[1] + p[2]*j]);
  }
  d.hotspots = [{name:'simulado', nodes:[hs[0][0]]}];
  return crimes;
}

function adjacency(d){ const a = d.nodes.map(() => []); d.edges.forEach((e, i) => { a[e.u].push([e.v, i]); a[e.v].push([e.u, i]); }); return a; }

async function loadData(){
  status('Cargando datos…');
  try {
    if (S.source === 'lima'){
      D = await loadLima();
      if (S.hotspot >= D.hotspots.length) S.hotspot = 0;
    } else if (S.source === 'synth'){
      D = edgesFinish(synthNetwork(S.seed));
      D.crimes = synthCrimes(D);
    } else {
      if (!D || D.kind !== 'osm' || D.key !== `${S.osmLat},${S.osmLon},${S.osmRadius}`){
        status('Descargando OpenStreetMap…');
        const o = await fetchOsm(S.osmLon, S.osmLat, S.osmRadius, true);
        const net = osmNetwork(o.ways);
        if (!net.edges.length) throw new Error('sin calles en esa zona');
        D = edgesFinish({...net, buildings:o.buildings, parks:o.parks, water:o.water, kind:'osm', key:`${S.osmLat},${S.osmLon},${S.osmRadius}`, origin:[S.osmLon, S.osmLat]});
      }
      D.crimes = synthCrimes(D);
      D.label = `OSM (${S.osmLat.toFixed(4)}, ${S.osmLon.toFixed(4)})`;
    }
    status(D.label + ` · ${D.nodes.length} nodos · ${D.edges.length} aristas`);
  } catch (e) {
    status(`No se pudo cargar (${e.message}). Uso la red sintética. ` + (S.source === 'lima' ? 'Abre la página con run_dashboard.bat.' : ''), true);
    S.source = 'synth'; D = edgesFinish(synthNetwork(S.seed)); D.crimes = synthCrimes(D);
  }
  buildControls();
  derive();
}

// ───────────────────────── derivados ─────────────────────────
let X = {};   // derivados de datos
function derive(){
  const {nodes, edges, crimes} = D;
  const crimeEdge = new Int32Array(crimes.length), crimeNode = new Int32Array(crimes.length);
  crimes.forEach((c, k) => {
    let be = 0, bd = Infinity;
    edges.forEach((e, i) => { if (c[0] < e.bb[0]-60 || c[0] > e.bb[2]+60 || c[1] < e.bb[1]-60 || c[1] > e.bb[3]+60) return;
      for (let j = 1; j < e.pts.length; j++){ const q = segD2(c[0], c[1], e.pts[j-1][0], e.pts[j-1][1], e.pts[j][0], e.pts[j][1]); if (q < bd){ bd = q; be = i; } } });
    crimeEdge[k] = be;
    let bn = 0, bnd = Infinity; nodes.forEach((p, i) => { const q = (p[0]-c[0])**2 + (p[1]-c[1])**2; if (q < bnd){ bnd = q; bn = i; } });

function syncInputs(){ rows.forEach(r => { if (!r.key) return; if (r.type === 'check') r.inp.checked = !!S[r.key]; else r.inp.value = S[r.key]; if (r.val) r.val.textContent = S[r.key]; }); }
function centerHot(){
  const [x, y] = hotspotCenter(); S.viewX = Math.round(x); S.viewY = Math.round(y); S.zoomDX = 0; S.zoomDY = 0;
  // el zoom va al nodo más intenso del hotspot (la «cruz» de la figura)
  const ns = D.hotspots && D.hotspots[S.hotspot] ? D.hotspots[S.hotspot].nodes : [];
  if (X.f && ns.length){ const m = ns.reduce((a, b) => X.f[b] > X.f[a] ? b : a); S.zoomDX = Math.round(D.nodes[m][0] - x); S.zoomDY = Math.round(D.nodes[m][1] - y); }
  syncInputs(); save();
}

const ACTIONS = {
  center(){ centerHot(); invalidate(2); },
  async loadOsm(){ D = null; await loadData(); centerHot(); invalidate(3); },
  async osmBg(){
    if (!D.origin) return;
    status('Descargando edificios y parques…');
    try {
      const o = await fetchOsm(D.origin[0] + S.viewX/(Math.cos(D.origin[1]*Math.PI/180)*111320), D.origin[1] - S.viewY/110540, S.viewSize*0.75, false);
      // fetchOsm proyecta respecto al centro pedido; se lleva al origen del recorte
      const sh = p => p.map(q => [q[0] + S.viewX, q[1] + S.viewY]);
      D.buildings = o.buildings.map(sh); D.parks = o.parks.map(sh); D.water = o.water.map(sh);
      status(`${D.label} · +${o.buildings.length} edificios, ${o.parks.length} parques`); invalidate(2);
    } catch (e) { status('OSM no respondió: ' + e.message, true); }
  },
  png(){
    if (S.exportFormat === 'svg'){
      // vectorial: calles, polígonos, círculos y texto; el KDE va embebido como imagen
      SVG_MODE = true; const sv = new SvgCtx();
      try { render(sv, 1, true, S.transparent); } finally { SVG_MODE = false; }
      download(new Blob([sv.toSVG()], {type:'image/svg+xml'}), 'figura_capas.svg'); return;
    }
    const cv = document.createElement('canvas'), sc = +S.exportScale;
    render(cv, sc, true, S.transparent);
    cv.toBlob(b => download(b, `figura_capas_${sc}x.png`), 'image/png');
  },
  json(){ const b = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'}), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'figura_capas_config.json'; a.click(); },
  load(){
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = async () => { try { Object.assign(S, JSON.parse(await i.files[0].text())); save(); await loadData(); invalidate(3); } catch (e) { status('Configuración inválida', true); } };
    i.click();
  },
  async reset(){ S = Object.assign({}, DEFAULTS); save(); await loadData(); centerHot(); invalidate(3); },
};

// ───────────────────────── arranque ─────────────────────────
(async () => {
  const first = !localStorage.getItem(KEY);
  await loadData();
  derive();
  if (first) centerHot();
  invalidate(3);
})();
</script>
